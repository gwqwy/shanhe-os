name: 构建山河Linux ISO

# 触发方式：
#   1. 推送 v* 标签（如 v0.1.1）→ 构建 + 自动发布 Release（含分卷 ISO）
#   2. Actions 页面手动 Run workflow → 仅构建，产物在 Artifacts 里下载
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间（构建全程需 ~15GB，运行器默认只有 ~14GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: 还原软件包缓存（加速二次构建）
        uses: actions/cache@v4
        with:
          path: live/cache
          key: lb-cache-${{ hashFiles('live/config/package-lists/**', 'live/auto/config') }}
          restore-keys: |
            lb-cache-

      - name: 构建 ISO（CI 用 Debian 官方源，机房直连更快）
        run: |
          set -o pipefail
          sudo SHANHE_MIRROR="https://deb.debian.org/debian" \
               SHANHE_MIRROR_SECURITY="https://deb.debian.org/debian-security" \
               bash build.sh 2>&1 | tee build.log

      - name: ISO 分卷（GitHub 单文件上限 2GB）
        run: |
          ISO=$(ls -1 山河Linux-*.iso | head -n1)
          echo "构建产物: $ISO"
          mkdir -p release
          split -b 1900M -d "$ISO" "release/${ISO}.part"
          ls -lh release/
          sha256sum "$ISO" release/* | tee SHA256SUMS.txt

      - name: 构建失败时输出日志尾部（供诊断）
        if: failure()
        run: tail -n 200 build.log || true

      - name: 上传构建产物（Artifacts，保留 14 天；失败时至少留下 build.log）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanhe-linux-iso-${{ github.run_id }}
          path: |
            release/
            SHA256SUMS.txt
            build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 发布 Release（仅 v* 标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO=$(ls -1 山河Linux-*.iso | head -n1)
          # 只截取 CHANGELOG 中当前版本的段落，Release 说明不随版本积累变长
          awk -v hdr "## ${GITHUB_REF_NAME}" '
            index($0, hdr) == 1 { flag = 1 }
            /^## / && flag && index($0, hdr) != 1 { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_SECTION.md
          if [ ! -s RELEASE_SECTION.md ]; then
            echo "## 山河Linux ${GITHUB_REF_NAME}" > RELEASE_SECTION.md
            echo "> （CHANGELOG.md 中未找到 ${GITHUB_REF_NAME} 段落，请补充更新说明）" >> RELEASE_SECTION.md
          fi
          { cat RELEASE_SECTION.md
            echo
            echo '---'
            echo '## ISO 分卷与校验'
            echo "ISO 文件名：\`$ISO\`"
            echo '下载全部 part 文件放在同一目录后合并：'
            echo "- Windows CMD：\`copy /b ${ISO}.part00 + ${ISO}.part01 ${ISO}\`"
            echo "- Linux/macOS：\`cat ${ISO}.part* > ${ISO}\`"
            echo '合并后校验：`sha256sum '$ISO'`（Windows 用 certutil -hashfile ... SHA256）'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > RELEASE_NOTES.md
          gh release create "${GITHUB_REF_NAME}" \
              --title "山河Linux ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              release/*
